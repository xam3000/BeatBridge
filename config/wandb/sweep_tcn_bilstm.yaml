program: wandb_sweep.py
name: tcn-bilstm-transition-control-v1-bayesian-miniter50-warmup5-plateau10-20260930
method: bayes
metric:
  name: best_validation_loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 50
  eta: 3

# Tune the fixed four-bar Feature Protocol 1 model. Dataset, renderer,
# objective, waveform sample rate, and the core encoder/controller widths stay
# fixed so trials optimize one comparable validation contract.
parameters:
  seed:
    value: 20260930
  max_epochs:
    value: 150
  batch_size:
    values: [3, 5, 7]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.002
  lr_warmup_epochs:
    value: 5
  lr_warmup_start_factor:
    value: 0.1
  lr_scheduler_patience:
    value: 10
  lr_scheduler_factor:
    value: 0.5
  lr_scheduler_threshold:
    value: 0.0001
  lr_scheduler_min_lr_factor:
    value: 0.05
  weight_decay:
    values: [0.00001, 0.0001, 0.0003]
  gradient_clip_norm:
    values: [0.5, 1.0, 2.0]
  encoder_channels:
    value: [64, 128]
  tcn_kernel_size:
    values: [3, 5, 7]
  tcn_dilation:
    values: [1, 2, 4]
  fusion_dimension:
    value: 256
  controller_hidden_size:
    value: 128
  controller_layers:
    value: 2
  output_dimension:
    value: 10
  dropout:
    values: [0.0, 0.1, 0.2]
  increment_logit_bound:
    value: 0.6

command:
  - ${env}
  - .venv/Scripts/python.exe
  - ${program}
  - sweep-tcn-bilstm
  - output/datasets/feature_protocol_v1_extended_bpm145_165_top10_4bar_split_20260805
  - output/training_runs/wandb_sweeps/tcn_bilstm_transition_control_v1
  - --cache-root
  - output/ml_cache/bridge_waveform_v1
  - --device
  - auto
  - --no-wandb-log-checkpoints
