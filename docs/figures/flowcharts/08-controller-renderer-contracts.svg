    </g>
    <g id="renderer_2" data-category="render">
      <rect x="365" y="450" width="310" height="130" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="520.0" y="509.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Three-band renderer</text>
      <text x="520.0" y="536.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Low / mid / high + ducking</text>
    </g>
    <g id="objective_2" data-category="evaluation">
      <rect x="740" y="450" width="245" height="130" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="862.5" y="522.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Objective v4</text>
    </g>
    <g id="model_3" data-category="control">
      <rect x="20" y="640" width="290" height="130" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="165.0" y="699.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Variable TCN/BiLSTM</text>
      <text x="165.0" y="726.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">2 / 4 / 6 / 8 bars</text>
    </g>
    <g id="renderer_3" data-category="render">
      <rect x="365" y="640" width="310" height="130" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="520.0" y="699.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Stem-aware renderer</text>
      <text x="520.0" y="726.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Accompaniment + vocals</text>
    </g>
    <g id="objective_3" data-category="evaluation">
      <rect x="740" y="640" width="245" height="130" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="862.5" y="699.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Objective v5</text>
      <text x="862.5" y="726.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Time-normalised</text>
    </g>
  </g>
  <g id="edge-labels">
    <text x="165" y="30" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Controller</text>
    <text x="520" y="30" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Training renderer</text>
    <text x="870" y="30" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Proxy objective</text>
    <text x="500" y="820" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">The generic fixed-TCN training path uses mid-band ducking as a vocal proxy.</text>
  </g>
