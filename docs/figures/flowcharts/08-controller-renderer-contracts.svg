<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160mm" height="135.20mm" viewBox="0 0 1000 845" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Controller, renderer and objective contracts</title>
  <desc id="figure-description">The four trained controller families use different rendering and objective contracts. The variable TCN uses a stem-aware renderer, not the fixed TCN's three-band renderer.</desc>
  <metadata>BeatBridge; evidence baseline 2026-10-27; artwork 2026-10-28; see README.md.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#48535E" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="845" fill="#FFFFFF" />
  <g id="connections" fill="none" stroke="#48535E" stroke-width="2" stroke-linejoin="round">
    <path d="M 310,135 L 365,135" marker-end="url(#arrow)" />
    <path d="M 675,135 L 740,135" marker-end="url(#arrow)" />
    <path d="M 310,325 L 365,325" marker-end="url(#arrow)" />
    <path d="M 675,325 L 740,325" marker-end="url(#arrow)" />
    <path d="M 310,515 L 365,515" marker-end="url(#arrow)" />
    <path d="M 675,515 L 740,515" marker-end="url(#arrow)" />
    <path d="M 310,705 L 365,705" marker-end="url(#arrow)" />
    <path d="M 675,705 L 740,705" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
