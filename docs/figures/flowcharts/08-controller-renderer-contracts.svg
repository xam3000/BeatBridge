      <rect x="20" y="70" width="290" height="130" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="165.0" y="129.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Time-shared MLP</text>
      <text x="165.0" y="156.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Four bars</text>
    </g>
    <g id="renderer_0" data-category="render">
      <rect x="365" y="70" width="310" height="130" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="520.0" y="129.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Two-band renderer</text>
      <text x="520.0" y="156.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Mix + low-end handover</text>
    </g>
    <g id="objective_0" data-category="evaluation">
      <rect x="740" y="70" width="245" height="130" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="862.5" y="142.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Objective v4</text>
    </g>
    <g id="model_1" data-category="control">
      <rect x="20" y="260" width="290" height="130" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="165.0" y="319.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Vocal-aware MLP</text>
      <text x="165.0" y="346.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Four bars</text>
