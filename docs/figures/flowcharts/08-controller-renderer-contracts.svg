      <text x="520.0" y="319.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Stem-aware renderer</text>
      <text x="520.0" y="346.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Accompaniment + vocals</text>
    </g>
    <g id="objective_1" data-category="evaluation">
      <rect x="740" y="260" width="245" height="130" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="862.5" y="332.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Objective v5</text>
