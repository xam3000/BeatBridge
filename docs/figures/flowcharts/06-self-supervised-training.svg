<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160mm" height="168.00mm" viewBox="0 0 1000 1050" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Self-supervised controller training</title>
  <desc id="figure-description">The fixed proxy objective supplies gradients through a differentiable renderer; validation selects checkpoints without updating weights.</desc>
  <metadata>BeatBridge; evidence baseline 2026-10-27; artwork 2026-10-28; see README.md.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#48535E" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1050" fill="#FFFFFF" />
  <g id="connections" fill="none" stroke="#48535E" stroke-width="2" stroke-linejoin="round">
    <path d="M 280,140 L 280,240" marker-end="url(#arrow)" />
    <path d="M 280,340 L 280,440" marker-end="url(#arrow)" />
    <path d="M 280,540 L 280,640" marker-end="url(#arrow)" />
    <path d="M 280,750 L 280,870" marker-end="url(#arrow)" stroke-dasharray="8 5" />
    <path d="M 80,920 L 30,920 L 30,290 L 80,290" marker-end="url(#arrow)" stroke-dasharray="8 5" />
    <path d="M 620,497.5 L 550,497.5 L 550,490 L 480,490" marker-end="url(#arrow)" />
    <path d="M 480,290 L 550,290 L 550,297.5 L 620,297.5" marker-end="url(#arrow)" />
    <path d="M 790,240 L 790,150" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g id="features" data-category="data">
      <rect x="80" y="40" width="400" height="100" rx="18" fill="#E1F1EF" stroke="#28756F" stroke-width="1.5" />
      <text x="280.0" y="97.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Training features</text>
    </g>
    <g id="model" data-category="control">
      <rect x="80" y="240" width="400" height="100" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="280.0" y="284.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Feature-to-control model</text>
      <text x="280.0" y="311.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Predict mixing curves</text>
    </g>
    <g id="renderer" data-category="render">
      <rect x="80" y="440" width="400" height="100" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="280.0" y="484.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Differentiable renderer</text>
      <text x="280.0" y="511.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Apply predicted controls</text>
    </g>
    <g id="objective" data-category="evaluation">
      <rect x="80" y="640" width="400" height="110" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="280.0" y="689.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Fixed proxy objective</text>
      <text x="280.0" y="716.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Audio and feature-based terms</text>
    </g>
    <g id="optimiser" data-category="control">
      <rect x="80" y="870" width="400" height="100" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="280.0" y="914.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">AdamW update</text>
      <text x="280.0" y="941.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Controller parameters only</text>
    </g>
    <g id="waveforms" data-category="data">
      <rect x="620" y="440" width="340" height="115" rx="18" fill="#E1F1EF" stroke="#28756F" stroke-width="1.5" />
      <text x="790.0" y="491.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Training waveform cache</text>
      <text x="790.0" y="518.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Mixes and required vocal stems</text>
    </g>
    <g id="validation" data-category="evaluation">
      <rect x="620" y="240" width="340" height="115" rx="5" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="790.0" y="278.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Validation pass</text>
      <text x="790.0" y="305.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Same renderer and objective; no</text>
      <text x="790.0" y="332.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">weight update</text>
    </g>
    <g id="checkpoints" data-category="control">
      <rect x="620" y="40" width="340" height="110" rx="18" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="790.0" y="89.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Select best checkpoint</text>
      <text x="790.0" y="116.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Save history and resume state</text>
    </g>
  </g>
  <g id="edge-labels">
    <rect x="316.5" y="801" width="147.0" height="26" fill="#FFFFFF" />
    <text x="390" y="820" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">backpropagation</text>
    <rect x="480.5" y="191" width="139.0" height="26" fill="#FFFFFF" />
    <text x="550" y="210" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">model selection</text>
    <text x="500" y="1020" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">No target control curves or human quality labels are required.</text>
  </g>
</svg>