<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160mm" height="132.80mm" viewBox="0 0 1000 830" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Objective v5: stem-aware vocal losses</title>
  <desc id="figure-description">Objective v5: stem-aware vocal losses</desc>
