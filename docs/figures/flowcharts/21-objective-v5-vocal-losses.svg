  </g>
  <g id="nodes">
    <g id="inputs" data-category="data">
      <rect x="120" y="30" width="760" height="90" rx="18" fill="#E1F1EF" stroke="#28756F" stroke-width="1.5" />
      <text x="500.0" y="82.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Vocal gains g_A/g_B and stem-weighted strengths s_A/s_B</text>
    </g>
    <g id="component_0" data-category="control">
      <rect x="120" y="180" width="760" height="120" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="500.0" y="220.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Stem overlap · weight 1.0</text>
      <text x="500.0" y="247.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">mean(s_A * s_B * (g_A * g_B)^2)</text>
      <text x="500.0" y="274.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Penalise two strong vocal stems being audible together</text>
    </g>
    <g id="component_1" data-category="control">
      <rect x="120" y="330" width="760" height="120" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="500.0" y="370.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Vocal audibility · weight 0.5</text>
      <text x="500.0" y="397.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">mean(s_A * (1 - 0.75*s_B) * (1 - g_A)^2 + symmetric B term)</text>
      <text x="500.0" y="424.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Avoid suppressing an active vocal without sufficient reason</text>
    </g>
    <g id="component_2" data-category="control">
      <rect x="120" y="480" width="760" height="120" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="500.0" y="520.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Mid-phrase gain change · weight 0.2</text>
      <text x="500.0" y="547.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">mean(mid(s_A*(1-offset_A)) * (Δg_A)^2</text>
      <text x="500.0" y="574.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">+ mid(s_B*(1-onset_B)) * (Δg_B)^2)</text>
    </g>
    <g id="output" data-category="evaluation">
      <rect x="120" y="670" width="760" height="100" rx="18" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="500.0" y="714.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Add vocal terms to the configured base objective</text>
      <text x="500.0" y="741.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Default v5 disables v4 feature-vocal overlap/boundary weights</text>
    </g>
  </g>
