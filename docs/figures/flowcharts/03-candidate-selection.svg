<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160mm" height="172.80mm" viewBox="0 0 1000 1080" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Automatic transition-candidate selection</title>
  <desc id="figure-description">Candidate generation, strict feasibility filters, feature ranking and top-k selection; manual cues form a separate workflow.</desc>
  <metadata>BeatBridge; evidence baseline 2026-10-27; artwork 2026-10-28; see README.md.</metadata>
