<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160mm" height="156.80mm" viewBox="0 0 1000 980" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Rendered-transition baseline metric</title>
  <desc id="figure-description">Rendered-transition baseline metric</desc>
  <metadata>BeatBridge; metric definitions audited 2026-10-29; code defaults, not run-specific weights; see METRICS_README.md.</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#48535E" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="980" fill="#FFFFFF" />
  <g id="connections" fill="none" stroke="#48535E" stroke-width="2" stroke-linejoin="round">
    <path d="M 120,75 L 50,75 L 50,240 L 120,240" marker-end="url(#arrow)" />
    <path d="M 880,240 L 950,240 L 950,870 L 880,870" marker-end="url(#arrow)" />
    <path d="M 120,75 L 50,75 L 50,390 L 120,390" marker-end="url(#arrow)" />
    <path d="M 880,390 L 950,390 L 950,870 L 880,870" marker-end="url(#arrow)" />
    <path d="M 120,75 L 50,75 L 50,540 L 120,540" marker-end="url(#arrow)" />
    <path d="M 880,540 L 950,540 L 950,870 L 880,870" marker-end="url(#arrow)" />
    <path d="M 120,75 L 50,75 L 50,690 L 120,690" marker-end="url(#arrow)" />
    <path d="M 880,690 L 950,690 L 950,870 L 880,870" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g id="inputs" data-category="data">
      <rect x="120" y="30" width="760" height="90" rx="18" fill="#E1F1EF" stroke="#28756F" stroke-width="1.5" />
      <text x="500.0" y="82.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Rendered audio + exact bridge boundaries + expected BPM</text>
    </g>
    <g id="component_0" data-category="render">
      <rect x="120" y="180" width="760" height="120" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="500.0" y="220.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Energy shape · weight 0.30</text>
      <text x="500.0" y="247.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">sqrt(clip(fall_dB / 6, 0, 1) * clip(rise_dB / 6, 0, 1))</text>
      <text x="500.0" y="274.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Compare pre-context, whole bridge and post-context RMS</text>
    </g>
    <g id="component_1" data-category="render">
      <rect x="120" y="330" width="760" height="120" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="500.0" y="370.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Boundary smoothness · weight 0.30</text>
      <text x="500.0" y="397.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Average sqrt(RMS_score * click_score) over actual boundaries</text>
      <text x="500.0" y="424.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Local loudness jumps and sample discontinuities</text>
    </g>
    <g id="component_2" data-category="render">
      <rect x="120" y="480" width="760" height="120" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="500.0" y="520.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Harmonic continuity · weight 0.20</text>
      <text x="500.0" y="547.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Average chroma cosine similarity:</text>
      <text x="500.0" y="574.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">pre → first bridge half; second bridge half → post</text>
    </g>
    <g id="component_3" data-category="render">
      <rect x="120" y="630" width="760" height="120" rx="5" fill="#EEE8F7" stroke="#6F5591" stroke-width="1.5" />
      <text x="500.0" y="670.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Rhythmic stability · weight 0.20</text>
      <text x="500.0" y="697.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Mean-centred onset correlation at the expected beat lag</text>
      <text x="500.0" y="724.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">score = (correlation + 1) / 2</text>
    </g>
    <g id="output" data-category="evaluation">
      <rect x="120" y="820" width="760" height="100" rx="18" fill="#E6F2E4" stroke="#4F7643" stroke-width="1.5" />
      <text x="500.0" y="864.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Weighted sum → rendered-variant ranking</text>
      <text x="500.0" y="891.0" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Score in [0,1] · higher is better; separate from the training loss</text>
    </g>
  </g>
  <g id="edge-labels">
    <text x="500" y="960" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Code defaults shown; each run's saved configuration is authoritative.</text>
  </g>
</svg>