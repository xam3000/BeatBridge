      <text x="500.0" y="895.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Controller inputs</text>
      <text x="500.0" y="922.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">A/B: T × 54; globals: 16</text>
      <text x="500.0" y="949.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Protocol 2 also supplies L/8</text>
    </g>
  </g>
  <g id="edge-labels" />
