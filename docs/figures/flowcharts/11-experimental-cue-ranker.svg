  <title id="figure-title">Experimental learned cue-ranker pipeline</title>
  <desc id="figure-description">Implemented extension with synthetic verification only. No real-data ranker training or independent musical quality result is established.</desc>
  <metadata>BeatBridge; evidence baseline 2026-10-27; artwork 2026-10-28; see README.md.</metadata>
