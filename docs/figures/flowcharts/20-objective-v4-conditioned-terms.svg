      <text x="500.0" y="397.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Handover rate × source cut cost and target entry cost</text>
      <text x="500.0" y="424.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Offset, onset and phrase-progress features condition the cost</text>
    </g>
    <g id="component_2" data-category="control">
      <rect x="120" y="480" width="760" height="120" rx="5" fill="#FFF0D7" stroke="#9C641B" stroke-width="1.5" />
      <text x="500.0" y="520.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Transient artifact proxy · weight 0.08</text>
      <text x="500.0" y="547.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Onset / spectral-flux importance × (mix rate + 0.5 * low rate)</text>
