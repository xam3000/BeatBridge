      <text x="500.0" y="220.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Vocal overlap · weight 1.0</text>
      <text x="500.0" y="247.5" fill="#1B2630" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">mean(s_A * s_B * (gain_A * gain_B)^2)</text>
